name: Maven CI - Calidad de Software

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 1. Compilacion Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compilar el proyecto
        run: mvn -B clean compile

  test:
    name: 2. Pruebas unitarias JUnit
    runs-on: ubuntu-latest
    needs: build
